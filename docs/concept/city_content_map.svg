<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a0c10"/><stop offset="100%" stop-color="#11151b"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>

<text x="60" y="62" fill="#e8b64c" font-family="Helvetica,Arial" font-size="26" font-weight="bold" letter-spacing="6">LEVERAGE</text>
<text x="60" y="92" fill="#5c6674" font-family="Helvetica,Arial" font-size="13" letter-spacing="3">CINDER CITY — CONTENT MAP</text>

